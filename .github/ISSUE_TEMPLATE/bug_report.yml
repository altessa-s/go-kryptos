name: Bug Report
description: Report a bug in go-kryptos
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below.

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: "go1.27.0 linux/amd64"
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: go-kryptos Version
      description: The version or commit SHA of go-kryptos you are using.
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package is affected?
      options:
        - kryptos
        - codec
        - codec/base64key
        - codec/jsonvalue
        - manager
        - providers/memory
        - providers/vault
        - providers/gcp
        - providers/gcp/fake
        - providers/lockbox
        - providers/lockbox/fake
        - kryptostest
        - internal/clone
        - internal/zero
        - internal/keystate
        - internal/lru
        - integration/docker
        - devtools
        - ci
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Create a ...
        2. Call ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages and stack traces if applicable.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, or screenshots.
    validations:
      required: false

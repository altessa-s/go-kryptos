name: Feature Request
description: Suggest a new feature or enhancement for go-kryptos
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the sections below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: A clear description of the problem this feature would solve.
      placeholder: "I'm always frustrated when ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like, including API sketches if applicable.
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Which package would this feature belong to?
      options:
        - kryptos
        - codec
        - codec/base64key
        - codec/jsonvalue
        - manager
        - providers/memory
        - providers/vault
        - providers/gcp
        - providers/gcp/fake
        - providers/lockbox
        - providers/lockbox/fake
        - sealbox
        - kryptostest
        - internal/clone
        - internal/zero
        - internal/keystate
        - internal/lru
        - integration/docker
        - devtools
        - ci
        - new package
        - not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, references, or screenshots.
    validations:
      required: false
